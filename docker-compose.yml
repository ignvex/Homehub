# HomeHub Docker Compose 部署配置
#
# 前置条件:
#   1. 已安装 Docker + Compose 插件
#   2. PostgreSQL 数据库已运行
#   3. 项目根目录下有 config.json（首次执行 cp config.example.json config.json 并修改）
#
# 使用:
#   docker compose build    # 构建镜像
#   docker compose up -d    # 后台启动
#   docker compose logs -f  # 查看日志
#   docker compose down     # 停止并移除容器
#
# 升级（本镜像只打包、不编译，见 Dockerfile 头部说明）:
#   替换 homehub 二进制（必要时同时替换 web/dist）后执行
#   docker compose up -d --build
#
# Unraid 用户注意:
#   - 通过 Unraid 的 Compose 插件或终端使用本文件
#   - 若容器无法连接 NAS 数据库，请切换到 host 网络模式（见下方注释）
#   - uploads 目录建议映射到 Unraid 的 /mnt/user/appdata/homehub/uploads

services:
  homehub:
    image: homehub:latest
    container_name: homehub
    build:
      context: .
      dockerfile: Dockerfile
    # 始终从本地 Dockerfile 构建，避免 `docker compose pull` 去远端
    # 拉取同名镜像覆盖掉本地构建结果。升级 = 换二进制 + 重新构建。
    pull_policy: build
    ports:
      - "8080:8080"
    volumes:
      # config.json 不打包进镜像，必须挂载（可写：首次启动会清除明文密码，Web 端配置更新也会写回）
      # 宿主机文件必须先存在：若不存在，Docker 会创建一个同名【目录】导致启动失败。
      # 首次部署：cp config.example.json config.json，再填写数据库与凭据
      - ./config.json:/app/config.json
      # 上传目录持久化 — 改为你的 Unraid 路径，如:
      # - /mnt/user/appdata/homehub/uploads:/app/web/static/uploads
      - homehub_uploads:/app/web/static/uploads
    restart: unless-stopped
    # 健康检查继承自 Dockerfile（探测 /api/v1/health），此处不重复定义。
    # 注意它只反映进程存活：数据库不可达时该接口仍返回 200。
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Asia/Shanghai
    # 长期运行在 NAS 上，限制日志体积避免撑满磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # === 网络模式说明 ===
    # Bridge（默认）：适用于大多数场景，容器通过端口映射访问。
    # Host：若容器无法访问宿主机或 NAS 上的数据库，取消下面注释切换到 host 网络模式。
    #       注意：host 模式下 ports 映射无效，应用直接监听宿主机 8080。
    # network_mode: host

volumes:
  homehub_uploads:
