              type: object
        "502":
          description: 上游 Extension 不可达或返回错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 列出 Extension 侧订阅
      tags:
      - Extension 对接
    post:
      consumes:
      - application/json
      description: 按 URL 幂等：首次推送新建，再次推送更新。省略的字段在对方侧保持原值
      parameters:
      - description: 订阅源 ID 与可选的启停覆盖
