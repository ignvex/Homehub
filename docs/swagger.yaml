      responses:
        "200":
          description: 更新后的用户信息
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/handler.Response'
        "409":
          description: 用户名已存在
          schema:
            $ref: '#/definitions/handler.Response'
