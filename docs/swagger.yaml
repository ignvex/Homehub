      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.ExtensionHubPushResult'
              type: object
        "404":
          description: 本地订阅源不存在
          schema:
            $ref: '#/definitions/handler.Response'
        "502":
          description: 上游 Extension 不可达或返回错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 推送单条订阅
      tags:
      - Extension 对接
  /extension/subscriptions/{id}:
