basePath: /api/v1
definitions:
  config.BackgroundConfig:
    properties:
      fade_duration_ms:
        description: 淡入淡出时长（毫秒），默认 1000
        type: integer
      interval_seconds:
        description: 轮播间隔（秒），默认 30
        type: integer
      mode:
        description: 背景模式：single / carousel / random，默认 "single"
        type: string
      selected_asset_ids:
        description: 选中的媒体资源 ID 列表
        items:
          type: integer
        type: array
      transition_effect:
        description: 过渡效果：fade / slide，默认 "fade"
        type: string
    type: object
  config.BookmarkConfig:
    properties:
      proxy_names:
        description: 代理名称列表（按优先级排列，fallback 链）
        items:
          type: string
        type: array
      use_proxy:
        description: 是否启用代理
        type: boolean
    type: object
  config.GravatarConfig:
    properties:
      custom_proxy_url:
        description: 自定义代理 URL（优先级高于 proxy_name）
        type: string
      default_size:
        description: 头像尺寸（像素），默认 200
        type: integer
      default_style:
        description: 默认头像风格：identicon / mp / robohash / retro / wavatar / blank /
          404
        type: string
      enabled:
        description: 是否启用以 Gravatar 生成头像
        type: boolean
      proxy_name:
        description: 引用的代理名称（对应 proxy 列表中的 name）
        type: string
      rating:
        description: 内容分级：g / pg / r / x
        type: string
      use_proxy:
        description: 是否通过代理下载 Gravatar
        type: boolean
    type: object
  config.LogConfig:
    properties:
      db_writer:
        description: 是否将日志写入数据库，默认 true
        type: boolean
      format:
        description: 日志格式：json / colored，默认 "json"
        type: string
      level:
        description: 日志级别：debug / info / warn / error，默认 "info"
        type: string
    type: object
  config.ProxyEntry:
    properties:
      enabled:
        description: 是否启用该代理
        type: boolean
      http_url:
        description: HTTP 代理地址（如 http://127.0.0.1:7890）
        type: string
      https_url:
        description: HTTPS 代理地址（type=http 时用于 https 请求；type=socks5 不使用此字段）
        type: string
      name:
        description: 代理名称（唯一标识）
        type: string
      type:
        description: 代理类型：http / socks5，默认 "http"
        type: string
    type: object
  config.RSSConfig:
    properties:
      background_fetch_enabled:
        description: 是否启用后台定时抓取，默认 true
        type: boolean
      background_fetch_interval:
        description: 后台抓取间隔（秒），默认 300
        type: integer
      proxy_names:
        description: 代理名称列表（按优先级排列，fallback 链）
        items:
          type: string
        type: array
      retention_count:
        description: 每个订阅源保留条目数，默认 5000
        type: integer
      use_proxy:
        description: 是否启用代理
        type: boolean
    type: object
  config.ServerConfig:
    properties:
      host:
        description: 监听地址，默认 "0.0.0.0"
        type: string
      port:
        description: 监听端口，默认 8080
        type: integer
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  handler.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  handler.changePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  handler.createBookmarkRequest:
    properties:
      group_id:
        type: integer
      icon:
        type: string
      priority:
        type: integer
      title:
        type: string
      url:
        type: string
    required:
    - group_id
    - title
    - url
    type: object
  handler.createGroupRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  handler.createRSSFeedRequest:
    properties:
      group_id:
        type: integer
      url:
        type: string
    required:
    - url
    type: object
  handler.createRSSGroupRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  handler.createTodoRequest:
    properties:
      description:
        type: string
      due_date:
        type: string
      priority:
        type: integer
      title:
        type: string
    required:
    - title
    type: object
  handler.createUserRequest:
    properties:
      email:
        type: string
      password:
        type: string
      role:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handler.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handler.reorderBookmarksRequest:
    properties:
      group_id:
        type: integer
      ids:
        items:
          type: integer
        type: array
    required:
    - group_id
    - ids
    type: object
  handler.reorderGroupsRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  handler.reorderTodosRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  handler.resetPasswordRequest:
    properties:
      new_password:
        type: string
    required:
    - new_password
    type: object
  handler.updateBookmarkRequest:
    properties:
      icon:
        type: string
      priority:
        type: integer
      title:
        type: string
      url:
        type: string
    type: object
  handler.updateGroupRequest:
    properties:
      name:
        type: string
      priority:
        type: integer
    required:
    - name
    type: object
  handler.updateProfileRequest:
    properties:
      email:
        type: string
      username:
        type: string
    type: object
  handler.updateRSSFeedRequest:
    properties:
      fetch_interval:
        type: integer
      group_id:
        type: integer
      title:
        type: string
    type: object
  handler.updateRSSGroupRequest:
    properties:
      name:
        type: string
      sort_order:
        type: integer
    type: object
  handler.updateTodoRequest:
    properties:
      description:
        type: string
      due_date:
        type: string
      priority:
        type: integer
      status:
        type: string
      title:
        type: string
    type: object
  handler.updateTodoStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  handler.updateUserRequest:
    properties:
      email:
        type: string
      is_active:
        type: boolean
      role:
        type: string
      username:
        type: string
    type: object
  model.Bookmark:
    properties:
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      group_id:
        type: integer
      icon:
        type: string
      id:
        type: integer
      priority:
        description: 展示优先级，值越大越靠前
        type: integer
      sort_order:
        type: integer
      title:
        type: string
      updated_at:
        type: string
      url:
        type: string
    type: object
  model.BookmarkGroup:
    properties:
      bookmarks:
        items:
          $ref: '#/definitions/model.Bookmark'
        type: array
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: integer
      name:
        type: string
      priority:
        description: 展示优先级，值越大越靠前
        type: integer
      sort_order:
        type: integer
      updated_at:
        type: string
    type: object
  model.MediaAsset:
    properties:
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      file_path:
        description: 相对路径（如 uploads/xxx.jpg）
        type: string
      file_size:
        description: 文件大小（字节）
        type: integer
      filename:
        description: 存储文件名（UUID）
        type: string
      height:
        description: 图片高度（像素）
        type: integer
      id:
        type: integer
      media_type:
        description: 媒体类型：image / video
        type: string
      mime_type:
        description: MIME 类型
        type: string
      original_name:
        description: 原始文件名
        type: string
      updated_at:
        type: string
      width:
        description: 图片宽度（像素）
        type: integer
    type: object
  model.User:
    properties:
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      email:
        type: string
      id:
        type: integer
      is_active:
        description: 是否启用
        type: boolean
      role:
        description: 角色：admin / user
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  service.AuthUpdate:
    properties:
      password:
        type: string
      session_secret:
        type: string
      username:
        type: string
    type: object
  service.BackgroundSettings:
    properties:
      fade_duration_ms:
        type: integer
      interval_seconds:
        type: integer
      mode:
        type: string
      selected_asset_ids:
        items:
          type: integer
        type: array
      transition_effect:
        type: string
    type: object
  service.DatabaseUpdate:
    properties:
      dbname:
        type: string
      host:
        type: string
      password:
        type: string
      port:
        type: integer
      sslmode:
        type: string
      user:
        type: string
    type: object
  service.LogUpdate:
    properties:
      db_writer:
        type: boolean
      format:
        type: string
      level:
        type: string
    type: object
  service.SafeAuthConfig:
    properties:
      username:
        type: string
    type: object
  service.SafeBilibiliConfig:
    properties:
      article_enabled:
        type: boolean
      enabled:
        type: boolean
      user_agent:
        type: string
      user_enabled:
        type: boolean
      video_enabled:
        type: boolean
    type: object
  service.SafeConfig:
    properties:
      auth:
        $ref: '#/definitions/service.SafeAuthConfig'
      background:
        $ref: '#/definitions/config.BackgroundConfig'
      bilibili:
        $ref: '#/definitions/service.SafeBilibiliConfig'
      bookmark:
        $ref: '#/definitions/config.BookmarkConfig'
      database:
        $ref: '#/definitions/service.SafeDatabaseConfig'
      gravatar:
        $ref: '#/definitions/config.GravatarConfig'
      log:
        $ref: '#/definitions/config.LogConfig'
      proxy:
        items:
          $ref: '#/definitions/service.SafeProxyEntry'
        type: array
      proxy_enabled:
        type: boolean
      rss:
        $ref: '#/definitions/config.RSSConfig'
      server:
        $ref: '#/definitions/config.ServerConfig'
    type: object
  service.SafeDatabaseConfig:
    properties:
      dbname:
        type: string
      host:
        type: string
      port:
        type: integer
      sslmode:
        type: string
      user:
        type: string
    type: object
  service.SafeProxyEntry:
    properties:
      enabled:
        type: boolean
      name:
        type: string
      type:
        type: string
    type: object
  service.ServerUpdate:
    properties:
      host:
        type: string
      port:
        type: integer
    type: object
  service.UpdateBackgroundRequest:
    properties:
      fade_duration_ms:
        type: integer
      interval_seconds:
        type: integer
      mode:
        type: string
      selected_asset_ids:
        items:
          type: integer
        type: array
      transition_effect:
        type: string
    type: object
  service.UpdateConfigRequest:
    properties:
      auth:
        $ref: '#/definitions/service.AuthUpdate'
      background:
        $ref: '#/definitions/config.BackgroundConfig'
      bookmark:
        $ref: '#/definitions/config.BookmarkConfig'
      database:
        $ref: '#/definitions/service.DatabaseUpdate'
      gravatar:
        $ref: '#/definitions/config.GravatarConfig'
      log:
        $ref: '#/definitions/service.LogUpdate'
      proxy:
        items:
          $ref: '#/definitions/config.ProxyEntry'
        type: array
      proxy_enabled:
        type: boolean
      rss:
        $ref: '#/definitions/config.RSSConfig'
      server:
        $ref: '#/definitions/service.ServerUpdate'
    type: object
host: localhost:8080
info:
  contact:
    name: HomeHub
  description: 个人中枢项目 API 接口文档，包含认证、书签管理、RSS订阅、待办事项、媒体资源、Bilibili 爬虫与数据查询、系统日志、配置管理等功能。
  title: HomeHub API
  version: "1.0"
paths:
  /admin/logs:
    get:
      description: 分页查看系统运行日志，支持按级别、关键词、时间范围筛选（仅管理员）
      parameters:
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页数量（默认 50）
        in: query
        name: per_page
        type: integer
      - description: 日志级别筛选：debug/info/warn/error
        in: query
        name: level
        type: string
      - description: 搜索关键词
        in: query
        name: q
        type: string
      - description: 起始时间（RFC3339 格式）
        in: query
        name: since
        type: string
      - description: 截止时间（RFC3339 格式）
        in: query
        name: until
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 日志列表（含分页信息）
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 查看系统日志
      tags:
      - 系统日志
  /admin/users:
    get:
      description: 返回所有注册用户的信息（仅管理员）
      produces:
      - application/json
      responses:
        "200":
          description: 用户列表
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.User'
                  type: array
              type: object
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 获取用户列表
      tags:
      - 用户管理
    post:
      consumes:
      - application/json
      description: 管理员创建新用户，可指定角色（admin/user）
      parameters:
      - description: 用户信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
        "400":
          description: 参数错误或用户名冲突
          schema:
            $ref: '#/definitions/handler.Response'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 创建用户
      tags:
      - 用户管理
  /admin/users/{id}:
    delete:
      description: 管理员删除用户及其所有会话
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 无效的用户 ID
          schema:
            $ref: '#/definitions/handler.Response'
        "403":
          description: 权限不足或不能删除自己
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 删除用户
      tags:
      - 用户管理
    get:
      description: 返回指定用户的完整信息（仅管理员）
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 用户详情
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
        "400":
          description: 无效的用户 ID
          schema:
            $ref: '#/definitions/handler.Response'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 获取用户详情
      tags:
      - 用户管理
    put:
      consumes:
      - application/json
      description: 管理员修改用户的用户名、角色或启用状态
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新字段
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.updateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handler.Response'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/handler.Response'
        "409":
          description: 用户名冲突
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 更新用户
      tags:
      - 用户管理
  /admin/users/{id}/refresh-avatar:
    post:
      description: 检查 Gravatar 是否有更新，若有则重新下载并更新缓存
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 刷新结果（updated 表示是否有更新）
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: 无效的用户 ID
          schema:
            $ref: '#/definitions/handler.Response'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 刷新头像缓存
      tags:
      - 用户管理
  /admin/users/{id}/reset-password:
    put:
      consumes:
      - application/json
      description: 管理员重置指定用户的密码，成功后该用户所有会话失效
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 新密码
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.resetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 重置成功
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handler.Response'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 重置用户密码
      tags:
      - 用户管理
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: 验证旧密码后修改为新密码，成功后清除所有会话
      parameters:
      - description: 修改密码请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.changePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 修改成功
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 请求参数错误或旧密码错误
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 修改密码
      tags:
      - 认证
  /auth/login:
    post:
      consumes:
      - application/json
      description: 验证用户名和密码，成功时设置 session cookie 并返回 token
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功，返回 token
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 用户登录
      tags:
      - 认证
  /auth/logout:
    post:
      description: 清除 session cookie 并注销
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 用户登出
      tags:
      - 认证
  /auth/profile:
    get:
      description: 返回当前登录用户的用户名、邮箱、角色和头像 URL
      produces:
      - application/json
      responses:
        "200":
          description: 用户个人信息
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 获取个人资料
      tags:
      - 认证
    put:
