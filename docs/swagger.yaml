        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.BalanceTargetInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.BalanceTargetView'
              type: object
        "404":
          description: 监控点不存在
          schema:
            $ref: '#/definitions/handler.Response'
        "409":
          description: 同名监控点已存在
          schema:
            $ref: '#/definitions/handler.Response'
