  /pastes/{id}:
    delete:
      description: 根据公开 ID 删除粘贴，需同时提供创建时返回的 delete_token。无需登录。
      parameters:
      - description: 公开 ID
        in: path
        name: id
        required: true
        type: string
      - description: 创建时返回的 delete_token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 不存在、已过期或密钥不匹配
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 删除粘贴
      tags:
      - 剪贴板
    get:
      description: 根据公开 ID 获取粘贴内容。已过期的粘贴返回 404。无需认证。
      parameters:
      - description: 公开 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 粘贴内容
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/handler.pasteResponse'
              type: object
        "404":
          description: 不存在或已过期
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 获取粘贴
      tags:
      - 剪贴板
  /rss/entries:
    get:
      description: 分页获取 RSS 订阅条目，可按订阅源筛选
      parameters:
      - description: 订阅源 ID 筛选
        in: query
        name: feed_id
        type: integer
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页数量（默认 20）
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 条目列表（含分页信息）
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 无效的 feed_id
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 获取 RSS 条目列表
      tags:
      - RSS 订阅
  /rss/feeds:
    get:
      description: 返回所有 RSS 订阅源及其最新状态，可按分组筛选
      parameters:
      - description: 分组 ID 筛选
        in: query
        name: group_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 订阅源列表
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 获取订阅源列表
      tags:
      - RSS 订阅
    post:
      consumes:
      - application/json
      description: 添加新的 RSS 订阅源，自动抓取标题和条目
      parameters:
      - description: 订阅源 URL
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createRSSFeedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 新创建的订阅源
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 无效的 URL
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 添加订阅源
      tags:
      - RSS 订阅
  /rss/feeds/{id}:
    delete:
      description: 删除订阅源及其所有关联条目
      parameters:
      - description: 订阅源 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 无效的订阅源 ID
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 订阅源不存在
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 删除订阅源
      tags:
      - RSS 订阅
    get:
      description: 根据 ID 获取单个 RSS 订阅源的详细信息
      parameters:
      - description: 订阅源 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 订阅源详情
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 无效的订阅源 ID
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 订阅源不存在
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 获取订阅源详情
      tags:
      - RSS 订阅
    put:
      consumes:
      - application/json
      description: 修改订阅源的标题、抓取间隔或所属分组
      parameters:
      - description: 订阅源 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.updateRSSFeedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 无效的请求参数
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 订阅源不存在
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 更新订阅源
      tags:
      - RSS 订阅
  /rss/feeds/{id}/fetch:
    post:
      description: 立即触发指定订阅源的抓取更新
      parameters:
      - description: 订阅源 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 抓取成功
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 无效的订阅源 ID
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 抓取失败
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 手动抓取订阅源
      tags:
      - RSS 订阅
  /rss/fetch-all:
    post:
      description: 立即触发所有到期订阅源的批量抓取
      produces:
      - application/json
      responses:
        "200":
          description: 抓取成功
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 抓取失败
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 抓取全部订阅源
      tags:
      - RSS 订阅
  /rss/groups:
    get:
      description: 返回所有 RSS 订阅分组，按排序序号排列
      produces:
      - application/json
      responses:
        "200":
          description: 分组列表
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 获取分组列表
      tags:
      - RSS 订阅
    post:
      consumes:
      - application/json
      description: 创建新的 RSS 订阅分组
      parameters:
      - description: 分组名称
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createRSSGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 新创建的分组
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 分组名称不能为空
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 创建分组
      tags:
      - RSS 订阅
  /rss/groups/{id}:
    delete:
      description: 删除分组（其下订阅源将移回未分组）
      parameters:
      - description: 分组 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 无效的分组 ID
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 分组不存在
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 删除分组
      tags:
      - RSS 订阅
    get:
      description: 返回分组信息及其下所有订阅源
      parameters:
      - description: 分组 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 分组详情（含订阅源列表）
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 无效的分组 ID
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 分组不存在
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 获取分组详情
      tags:
      - RSS 订阅
    put:
      consumes:
      - application/json
      description: 修改分组的名称和排序序号
      parameters:
      - description: 分组 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.updateRSSGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 无效的请求参数
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 分组不存在
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 更新分组
      tags:
      - RSS 订阅
  /search:
    get:
      description: 在书签与 RSS 条目中执行全文搜索，支持指定数据源范围
      parameters:
      - description: 搜索关键词
        in: query
        name: q
        required: true
        type: string
      - description: 搜索范围：all / bookmarks / rss（默认 all）
        in: query
        name: scope
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 搜索结果
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 缺少搜索关键词
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 联合搜索
      tags:
      - 搜索
  /todos:
    get:
      description: 获取所有待办事项，可按状态筛选和排序
      parameters:
      - description: 状态筛选：planned/pending/in_progress/completed/paused
        in: query
        name: status
        type: string
      - description: 排序字段（默认 priority）
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 待办列表
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 获取待办列表
      tags:
      - 待办事项
    post:
      consumes:
      - application/json
      description: 创建新的待办事项，可设置标题、描述、优先级和截止日期
      parameters:
      - description: 待办内容
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createTodoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 新创建的待办
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 缺少标题或参数错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 创建待办
      tags:
      - 待办事项
  /todos/{id}:
    delete:
      description: 删除指定待办事项
      parameters:
      - description: 待办 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 无效的待办 ID
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 待办不存在
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 删除待办
      tags:
      - 待办事项
    get:
      description: 根据 ID 获取单个待办事项
      parameters:
      - description: 待办 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 待办详情
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 无效的待办 ID
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 待办不存在
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 获取待办详情
      tags:
      - 待办事项
    put:
      consumes:
      - application/json
      description: 更新待办事项的标题、描述、状态、优先级或截止日期
      parameters:
      - description: 待办 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新请求（全部可选）
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.updateTodoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 无效的请求参数
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 更新待办
      tags:
      - 待办事项
  /todos/{id}/status:
    patch:
      consumes:
      - application/json
      description: 快捷修改待办事项的状态（planned/pending/in_progress/completed/paused）
      parameters:
      - description: 待办 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 新状态
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.updateTodoStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 无效的状态值
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 更新待办状态
      tags:
      - 待办事项
  /todos/reorder:
    post:
      consumes:
      - application/json
      description: 按 ID 顺序重新排列待办事项的显示顺序
      parameters:
      - description: 排序后的 ID 列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.reorderTodosRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 排序成功
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 缺少 ids
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 调整待办排序
      tags:
      - 待办事项
  /webui:
    get:
      description: 返回首页和登录页的背景设置、布局方案和已解析的静态资源 URL（无需登录）
      produces:
      - application/json
      responses:
        "200":
          description: WebUI 配置信息
          schema:
            $ref: '#/definitions/handler.Response'
        "503":
          description: 配置尚未加载
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 获取 WebUI 配置
      tags:
      - WebUI
swagger: "2.0"
