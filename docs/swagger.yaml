basePath: /api/v1
definitions:
  config.BackgroundConfig:
    properties:
      fade_duration_ms:
        description: 淡入淡出时长（毫秒），默认 1000
        type: integer
      interval_seconds:
        description: 轮播间隔（秒），默认 30
        type: integer
      mode:
        description: 背景模式：single / carousel / random，默认 "single"
        type: string
      selected_asset_ids:
        description: 选中的媒体资源 ID 列表
        items:
          type: integer
        type: array
      transition_effect:
        description: 过渡效果：fade / slide，默认 "fade"
        type: string
    type: object
  config.BookmarkConfig:
    properties:
      proxy_names:
        description: 代理名称列表（按优先级排列，fallback 链），空=直连
        items:
          type: string
        type: array
    type: object
  config.GravatarConfig:
    properties:
      default_size:
        description: 头像缓存尺寸（像素），默认 256，范围 16-512
        type: integer
      default_style:
        description: 默认头像风格：identicon / mp / robohash / retro / wavatar / blank /
          404
        type: string
      enabled:
        description: 是否启用以 Gravatar 生成头像
        type: boolean
      extension_token:
        description: ExtensionToken 调用 extension 时的 Bearer Token，留空则不带认证头。
        type: string
      extension_url:
        description: |-
          ExtensionURL 外部图片代理服务地址（如 http://homehub-extension:8090）。

          为空时直接从 Gravatar 官方下载（默认）；非空时全部交给 extension：
          HomeHub 单向发起 GET {ExtensionURL}/avatar/{hash}?s=&d=&r=，
          extension 不反向连接、不需要数据库凭据。
        type: string
      max_bytes:
        description: |-
          MaxBytes 单张头像的大小上限（字节），默认 2MB。
          超过上限的响应直接丢弃，不截断写入缓存。
        type: integer
      proxy_names:
        description: 直连模式下的代理名称列表（引用 proxy 池），空=直连
        items:
          type: string
        type: array
      rating:
        description: 内容分级：g / pg / r / x
        type: string
      timeout_seconds:
        description: TimeoutSeconds 单次上游请求超时（秒），默认 10。
        type: integer
    type: object
  config.HomeWebUIConfig:
    properties:
      background:
        $ref: '#/definitions/config.BackgroundConfig'
    type: object
  config.LogConfig:
    properties:
      db_writer:
        description: 是否将日志写入数据库，默认 true
        type: boolean
      format:
        description: 日志格式：json / colored，默认 "json"
        type: string
      level:
        description: 日志级别：debug / info / warn / error，默认 "info"
        type: string
    type: object
  config.LoginWebUIConfig:
    properties:
      background:
        $ref: '#/definitions/config.BackgroundConfig'
      layout:
        description: left / center / right
        type: string
    type: object
  config.ProxyEntry:
    properties:
      enabled:
        description: 是否启用该代理
        type: boolean
      http_url:
        description: HTTP 代理地址（如 http://127.0.0.1:7890）
        type: string
      https_url:
        description: HTTPS 代理地址（type=http 时用于 https 请求；type=socks5 不使用此字段）
        type: string
      name:
        description: 代理名称（唯一标识）
        type: string
      type:
        description: 代理类型：http / socks5，默认 "http"
        type: string
    type: object
  config.RSSConfig:
    properties:
      background_fetch_enabled:
        description: 是否启用后台定时抓取，默认 true
        type: boolean
      background_fetch_interval:
        description: 后台抓取间隔（秒），默认 300
        type: integer
      extension_token:
        description: ExtensionToken 调用 extension 时的 Bearer Token，留空则不带认证头。
        type: string
      extension_url:
        description: |-
          ExtensionURL 外部抓取服务地址（如 http://homehub-extension:8090）。

          为空时由 HomeHub 自己抓取（默认）。非空时把所有 RSS 抓取交给该服务：
          HomeHub 单向发起 GET {ExtensionURL}/fetch?url=...，extension 不反向连接。
        type: string
      fetch_concurrency:
        description: |-
          FetchConcurrency 同时抓取的订阅源数量，默认 4。
          单次抓取变慢时不会拖住整轮：并发上限保证 DB 与网络不至于被打满。
        type: integer
      fetch_timeout_seconds:
        description: |-
          FetchTimeoutSeconds 单个订阅源的抓取超时（秒），默认 30。
          超时只影响该订阅源，其他订阅源继续抓取。
        type: integer
      image_allow_private_hosts:
        description: |-
          ImageAllowPrivateHosts 是否允许图片缓存访问内网/回环地址，默认 false。
          仅在内网 RSS 源确实引用内网图片时开启；开启会削弱 SSRF 防护。
        type: boolean
      image_cache_concurrency:
        description: ImageCacheConcurrency 图片并发下载数，默认 6。
        type: integer
      image_cache_enabled:
        description: |-
          ImageCacheEnabled 是否把条目内嵌图片缓存到本地，默认 true。
          关闭后保留原始外链 URL，可显著加快抓取（图片下载是抓取耗时的主要来源）。
        type: boolean
      image_cleanup_enabled:
        description: ImageCleanupEnabled 是否自动清理没有条目引用的图片缓存，默认 true。
        type: boolean
      image_cleanup_interval_hours:
        description: ImageCleanupIntervalHours 后台清理间隔（小时），默认 24。
        type: integer
      image_max_bytes:
        description: |-
          ImageMaxBytes 单张图片的大小上限（字节），默认 10MB。
          超过上限的图片会被丢弃，而不是截断后写坏文件。
        type: integer
      image_retention_days:
        description: |-
          ImageRetentionDays 无引用图片的保留天数，默认 30。
          只有超过这个天数仍无人引用的文件才会被删除，给历史条目留出重新抓取登记的时间。
        type: integer
      proxy_names:
        description: 代理名称列表（按优先级排列，fallback 链），空=直连
        items:
          type: string
        type: array
      retention_count:
        description: 每个订阅源保留条目数，默认 5000
        type: integer
      user_agent:
        description: 自定义 User-Agent，空则默认 Chrome 150
        type: string
    type: object
  config.ServerConfig:
    properties:
      host:
        description: 监听地址，默认 "0.0.0.0"
        type: string
      port:
        description: 监听端口，默认 8080
        type: integer
    type: object
  config.WebUIConfig:
    properties:
      home:
        $ref: '#/definitions/config.HomeWebUIConfig'
      login:
        $ref: '#/definitions/config.LoginWebUIConfig'
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  handler.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  handler.changePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  handler.createBookmarkRequest:
    properties:
      group_id:
        type: integer
      icon:
        type: string
      priority:
        type: integer
      title:
        type: string
      url:
        type: string
    required:
    - group_id
    - title
    - url
    type: object
  handler.createGroupRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  handler.createPasteRequest:
    properties:
      content:
        type: string
    required:
    - content
    type: object
  handler.createRSSFeedRequest:
    properties:
      group_id:
        type: integer
      url:
        type: string
    required:
    - url
    type: object
  handler.createRSSGroupRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  handler.createTodoRequest:
    properties:
      description:
        type: string
      due_date:
        type: string
      priority:
        type: integer
      title:
        type: string
    required:
    - title
    type: object
  handler.createUserRequest:
    properties:
      email:
        type: string
      password:
        type: string
      role:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handler.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handler.pasteResponse:
    properties:
      content:
        type: string
      created_at:
        type: string
      delete_token:
        description: 仅创建时返回
        type: string
      expires_at:
        type: string
      id:
        type: string
    type: object
  handler.pasteSummary:
    properties:
      content_preview:
        type: string
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
    type: object
  handler.reorderBookmarksRequest:
    properties:
      group_id:
        type: integer
      ids:
        items:
          type: integer
        type: array
    required:
    - group_id
    - ids
    type: object
  handler.reorderGroupsRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  handler.reorderTodosRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  handler.resetPasswordRequest:
    properties:
      new_password:
        type: string
    required:
    - new_password
    type: object
  handler.updateBookmarkRequest:
    properties:
      icon:
        type: string
      priority:
        type: integer
      title:
        type: string
      url:
        type: string
    type: object
  handler.updateGroupRequest:
    properties:
      name:
        type: string
      priority:
        type: integer
    required:
    - name
    type: object
  handler.updateProfileRequest:
    properties:
      email:
        type: string
      username:
        type: string
    type: object
  handler.updateRSSFeedRequest:
    properties:
      fetch_interval:
        type: integer
      group_id:
        type: integer
      title:
        type: string
    type: object
  handler.updateRSSGroupRequest:
    properties:
      name:
        type: string
      sort_order:
        type: integer
    type: object
  handler.updateTodoRequest:
    properties:
      description:
        type: string
      due_date:
        type: string
      priority:
        type: integer
      status:
        type: string
      title:
        type: string
    type: object
  handler.updateTodoStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  handler.updateUserRequest:
    properties:
      email:
        type: string
      is_active:
        type: boolean
      role:
        type: string
      username:
        type: string
    type: object
  model.Bookmark:
    properties:
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      group_id:
        type: integer
      icon:
        type: string
      id:
        type: integer
      priority:
        type: integer
      sort_order:
        type: integer
      title:
        type: string
      updated_at:
        type: string
      url:
        type: string
    type: object
  model.BookmarkGroup:
    properties:
      bookmarks:
        items:
          $ref: '#/definitions/model.Bookmark'
        type: array
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: integer
      name:
        type: string
      priority:
        type: integer
      sort_order:
        type: integer
      updated_at:
        type: string
    type: object
  model.MediaAsset:
    properties:
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      file_path:
        description: 相对路径（如 uploads/xxx.jpg）
        type: string
      file_size:
        description: 文件大小（字节）
        type: integer
      filename:
        description: 存储文件名（UUID）
        type: string
      height:
        description: 图片高度（像素）
        type: integer
      id:
        type: integer
      media_type:
        description: 媒体类型：image / video
        type: string
      mime_type:
        description: MIME 类型
        type: string
      original_name:
        description: 原始文件名
        type: string
      updated_at:
        type: string
      width:
        description: 图片宽度（像素）
        type: integer
    type: object
  model.User:
    properties:
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      email:
        type: string
      id:
        type: integer
      is_active:
        description: 是否启用
        type: boolean
      role:
        description: 角色：admin / user
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  service.AuthUpdate:
    properties:
      password:
        type: string
      session_secret:
        type: string
      username:
        type: string
    type: object
  service.BackgroundSettings:
    properties:
      fade_duration_ms:
        type: integer
      interval_seconds:
        type: integer
      mode:
        type: string
      selected_asset_ids:
        items:
          type: integer
        type: array
      transition_effect:
        type: string
    type: object
  service.BalanceStatus:
    properties:
      enabled:
        type: boolean
      error_count:
        type: integer
      last_refresh_at:
        type: string
      ok_count:
        type: integer
      target_count:
        type: integer
    type: object
  service.DatabaseUpdate:
    properties:
      dbname:
        type: string
      host:
        type: string
      password:
        type: string
      port:
        type: integer
      sslmode:
        type: string
      user:
        type: string
    type: object
  service.LogUpdate:
    properties:
      db_writer:
        type: boolean
      format:
        type: string
      level:
        type: string
    type: object
  service.SafeAuthConfig:
    properties:
      username:
        type: string
    type: object
  service.SafeConfig:
    properties:
      auth:
        $ref: '#/definitions/service.SafeAuthConfig'
      bookmark:
        $ref: '#/definitions/config.BookmarkConfig'
      database:
        $ref: '#/definitions/service.SafeDatabaseConfig'
      gravatar:
        $ref: '#/definitions/config.GravatarConfig'
      log:
        $ref: '#/definitions/config.LogConfig'
      proxy:
        items:
          $ref: '#/definitions/service.SafeProxyEntry'
        type: array
      rss:
        $ref: '#/definitions/config.RSSConfig'
      server:
        $ref: '#/definitions/config.ServerConfig'
      webui:
        $ref: '#/definitions/config.WebUIConfig'
    type: object
  service.SafeDatabaseConfig:
    properties:
      dbname:
        type: string
      host:
        type: string
      port:
        type: integer
      sslmode:
        type: string
      user:
        type: string
    type: object
  service.SafeProxyEntry:
    properties:
      enabled:
        type: boolean
      name:
        type: string
      type:
        type: string
    type: object
  service.ServerUpdate:
    properties:
      host:
        type: string
      port:
        type: integer
    type: object
  service.TargetResult:
    properties:
      balance:
        description: 剩余余额
        type: number
      base_url:
        type: string
      currency:
        description: 货币单位，如 "CNY" / "USD" / "quota"
        type: string
      enabled:
        type: boolean
      last_checked_at:
        description: 最后查询时间
        type: string
      last_error:
        description: 最近错误信息
        type: string
      name:
        type: string
      status:
        description: '"ok" / "error" / "checking"'
        type: string
      type:
        type: string
    type: object
  service.UpdateBackgroundRequest:
    properties:
      fade_duration_ms:
        type: integer
      interval_seconds:
        type: integer
      mode:
        type: string
      selected_asset_ids:
        items:
          type: integer
        type: array
      transition_effect:
        type: string
    type: object
  service.UpdateConfigRequest:
    properties:
      auth:
        $ref: '#/definitions/service.AuthUpdate'
      bookmark:
        $ref: '#/definitions/config.BookmarkConfig'
      database:
        $ref: '#/definitions/service.DatabaseUpdate'
      gravatar:
        $ref: '#/definitions/config.GravatarConfig'
      log:
        $ref: '#/definitions/service.LogUpdate'
      proxy:
        items:
          $ref: '#/definitions/config.ProxyEntry'
        type: array
      rss:
        $ref: '#/definitions/config.RSSConfig'
      server:
        $ref: '#/definitions/service.ServerUpdate'
      webui:
        $ref: '#/definitions/config.WebUIConfig'
    type: object
host: localhost:8080
info:
  contact:
    name: HomeHub
  description: 个人中枢项目 API 接口文档，包含认证、书签管理、RSS订阅、待办事项、媒体资源、系统日志、配置管理等功能。
  title: HomeHub API
  version: "1.0"
paths:
  /admin/logs:
    delete:
      description: 删除所有系统日志记录（仅管理员）
      produces:
      - application/json
      responses:
        "200":
          description: 清除成功
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 清除全部日志
      tags:
      - 系统日志
    get:
      description: 分页查看系统运行日志，支持按级别、关键词、时间范围筛选（仅管理员）
      parameters:
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页数量（默认 50）
        in: query
        name: per_page
        type: integer
      - description: 日志级别筛选：debug/info/warn/error
        in: query
        name: level
        type: string
      - description: 搜索关键词
        in: query
        name: q
        type: string
      - description: 起始时间（RFC3339 格式）
        in: query
        name: since
        type: string
      - description: 截止时间（RFC3339 格式）
        in: query
        name: until
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 日志列表（含分页信息）
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 查看系统日志
      tags:
      - 系统日志
  /admin/logs/stream:
    get:
      description: 通过 Server-Sent Events 实时推送系统日志（仅管理员）
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE 事件流
          schema:
            type: string
      summary: 实时日志推送
      tags:
      - 系统日志
  /admin/users:
    get:
      description: 返回所有注册用户的信息（仅管理员）
      produces:
      - application/json
      responses:
        "200":
          description: 用户列表
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.User'
                  type: array
              type: object
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 获取用户列表
      tags:
      - 用户管理
    post:
      consumes:
      - application/json
      description: 管理员创建新用户，可指定角色（admin/user）
      parameters:
      - description: 用户信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
        "400":
          description: 参数错误或用户名冲突
          schema:
            $ref: '#/definitions/handler.Response'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 创建用户
      tags:
      - 用户管理
  /admin/users/{id}:
    delete:
      description: 管理员删除用户及其所有会话
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 无效的用户 ID
          schema:
            $ref: '#/definitions/handler.Response'
        "403":
          description: 权限不足或不能删除自己
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 删除用户
      tags:
      - 用户管理
    get:
      description: 返回指定用户的完整信息（仅管理员）
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 用户详情
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
        "400":
          description: 无效的用户 ID
          schema:
            $ref: '#/definitions/handler.Response'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 获取用户详情
      tags:
      - 用户管理
    put:
      consumes:
      - application/json
