      tags:
      - 配置
    put:
      consumes:
      - application/json
      description: 通过 Web 端部分更新 config.json，更新后触发热重载
      parameters:
      - description: 配置更新字段
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.UpdateConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 更新应用配置
      tags:
      - 配置
  /extension/key:
    delete:
      description: 清空 config.json 的 extension.private_key_pem；清空后无法签名，需先关闭 extension.enabled
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 移除签名私钥
      tags:
      - Extension 对接
    get:
      description: 返回密钥来自数据库还是文件，以及公钥与指纹；永不返回私钥
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.ExtensionHubKeyInfo'
              type: object
      summary: 查询签名私钥来源
      tags:
      - Extension 对接
    put:
      consumes:
      - application/json
      description: 接受 PKCS#8 PEM 或 base64；入库前自签自验。多实例共用同一个数据库时只需配置一次
      parameters:
      - description: 私钥内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.setExtensionKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.ExtensionHubKeyInfo'
              type: object
        "400":
          description: 私钥无法解析或自检失败
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 保存签名私钥到数据库
      tags:
      - Extension 对接
  /extension/keys:
    get:
      description: 响应不含明文也不含哈希；live 由服务端计算，宿主不要自己比较过期时间
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/hubclient.AccessKey'
                  type: array
              type: object
        "502":
          description: 上游 Extension 不可达或返回错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 列出访问密钥
      tags:
      - Extension 对接
    post:
      consumes:
      - application/json
      description: 明文 key 只在本响应出现一次，之后任何接口都拿不回
      parameters:
      - description: 名称与有效期
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.issueExtensionKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/hubclient.CreatedKey'
              type: object
        "502":
          description: 上游 Extension 不可达或返回错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 签发访问密钥
      tags:
      - Extension 对接
  /extension/keys/{id}:
    delete:
      description: 同时撤销它换出去的会话；该密钥名下的数据仍可被同一主人的其他凭证读取
      parameters:
      - description: 密钥 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 已撤销或本就不存在
          schema:
            $ref: '#/definitions/handler.Response'
        "502":
          description: 上游 Extension 不可达或返回错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 撤销访问密钥
      tags:
      - Extension 对接
