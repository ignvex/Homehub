basePath: /api/v1
definitions:
  config.BackgroundConfig:
    properties:
      fade_duration_ms:
        description: 淡入淡出时长（毫秒），默认 1000
        type: integer
      interval_seconds:
        description: 轮播间隔（秒），默认 30
        type: integer
      mode:
        description: 背景模式：single / carousel / random，默认 "single"
        type: string
      selected_asset_ids:
        description: 选中的媒体资源 ID 列表
        items:
          type: integer
        type: array
      transition_effect:
        description: 过渡效果：fade / slide，默认 "fade"
        type: string
    type: object
  config.BookmarkConfig:
    type: object
  config.GravatarConfig:
    properties:
      default_size:
        description: 头像缓存尺寸（像素），默认 256，范围 16-512
        type: integer
      default_style:
        description: 默认头像风格：identicon / mp / robohash / retro / wavatar / blank /
          404
        type: string
      enabled:
        description: 是否启用以 Gravatar 生成头像
        type: boolean
      max_bytes:
        description: |-
          MaxBytes 单张头像的大小上限（字节），默认 2MB。
          超过上限的响应直接丢弃，不截断写入缓存。
        type: integer
      rating:
        description: 内容分级：g / pg / r / x
        type: string
      timeout_seconds:
        description: TimeoutSeconds 单次上游请求超时（秒），默认 10。
        type: integer
    type: object
  config.HomeWebUIConfig:
    properties:
      background:
        $ref: '#/definitions/config.BackgroundConfig'
    type: object
  config.LogConfig:
    properties:
      db_writer:
        description: 是否将日志写入数据库，默认 true
        type: boolean
      format:
        description: 日志格式：json / colored，默认 "json"
        type: string
      level:
        description: 日志级别：debug / info / warn / error，默认 "info"
        type: string
    type: object
  config.LoginWebUIConfig:
    properties:
      background:
        $ref: '#/definitions/config.BackgroundConfig'
      layout:
        description: left / center / right
        type: string
    type: object
  config.PikPakConfig:
    properties:
      auto_lock:
        description: |-
          AutoLock 抓取到磁力链接时自动锁定，避免后续抓取把它覆盖掉。
          默认 false：自动锁定会让“锁”失去“人工确认”的含义。
        type: boolean
      client_id:
        description: |-
          ClientID / ClientSecret 是 PikPak 分配的客户端标识。
          留空时提交会直接失败并给出明确提示，不猜测默认值。
        type: string
      client_secret:
        type: string
      enabled:
        description: Enabled 是否启用。默认 false —— 涉及第三方账号凭据，必须显式开启。
        type: boolean
      endpoint:
        description: |-
          Endpoint 服务地址，默认 https://api-drive.mypikpak.com。
          允许改是因为 PikPak 有多个区域端点，也可能自建反代。
        type: string
      password:
        type: string
      timeout_seconds:
        description: TimeoutSeconds 单次提交的超时，默认 15。
        type: integer
      username:
        description: |-
          Username / Password 是 PikPak 账号。

          与 config.json 里其他凭据一样是明文存储（该文件已 gitignore 且
          权限应设为 600）。不用 refresh_token 是因为它过期需要人工续期，
          对一个个人项目来说反而更容易失效。
        type: string
    type: object
  config.ProxyConfig:
    properties:
      default:
        description: 默认代理链（按优先级），空=直连
        items:
          type: string
        type: array
      entries:
        description: 命名代理池
        items:
          $ref: '#/definitions/config.ProxyEntry'
        type: array
    type: object
  config.ProxyEntry:
    properties:
      enabled:
        description: 是否启用该代理
        type: boolean
      http_url:
        description: HTTP 代理地址（如 http://127.0.0.1:7890）
        type: string
      https_url:
        description: HTTPS 代理地址（type=http 时用于 https 请求；type=socks5 不使用此字段）
        type: string
      name:
        description: 代理名称（唯一标识）
        type: string
      type:
        description: 代理类型：http / socks5，默认 "http"
        type: string
    type: object
  config.RSSConfig:
    properties:
      background_fetch_enabled:
        description: 是否启用后台定时抓取，默认 true
        type: boolean
      background_fetch_interval:
        description: 后台抓取间隔（秒），默认 300
        type: integer
      fetch_concurrency:
        description: |-
          FetchConcurrency 同时抓取的订阅源数量，默认 4。
          单次抓取变慢时不会拖住整轮：并发上限保证 DB 与网络不至于被打满。
        type: integer
      fetch_timeout_seconds:
        description: |-
          FetchTimeoutSeconds 单个订阅源的抓取超时（秒），默认 30。
          超时只影响该订阅源，其他订阅源继续抓取。
        type: integer
      image_allow_private_hosts:
        description: |-
          ImageAllowPrivateHosts 是否允许图片缓存访问内网/回环地址，默认 false。
          仅在内网 RSS 源确实引用内网图片时开启；开启会削弱 SSRF 防护。
        type: boolean
      image_cache_concurrency:
        description: ImageCacheConcurrency 图片并发下载数，默认 6。
        type: integer
      image_cache_enabled:
        description: |-
          ImageCacheEnabled 是否把条目内嵌图片缓存到本地，默认 true。
          关闭后保留原始外链 URL，可显著加快抓取（图片下载是抓取耗时的主要来源）。
        type: boolean
      image_cleanup_enabled:
        description: ImageCleanupEnabled 是否自动清理没有条目引用的图片缓存，默认 true。
        type: boolean
      image_cleanup_interval_hours:
        description: ImageCleanupIntervalHours 后台清理间隔（小时），默认 24。
        type: integer
      image_max_bytes:
        description: |-
          ImageMaxBytes 单张图片的大小上限（字节），默认 128MB。
          超过上限的图片会被丢弃，而不是截断后写坏文件。
          上限放到 2GB 是为高分辨率原图留余量；真正的约束是抓取预算，
          单张图太大时会先撞上 fetch_timeout_seconds。
        type: integer
      image_retention_days:
        description: |-
          ImageRetentionDays 无引用图片的保留天数，默认 30。
          只有超过这个天数仍无人引用的文件才会被删除，给历史条目留出重新抓取登记的时间。
        type: integer
      pikpak:
        allOf:
        - $ref: '#/definitions/config.PikPakConfig'
        description: |-
          PikPak 磁力链接辅助功能。关闭时所有相关 API 返回 503，
          锁定标记仍然可用（锁定本身不依赖 PikPak）。
      retention_count:
        description: RetentionCount 是关闭无限存储时，每个订阅源保留的条目数，默认 5000。
        type: integer
      retention_unlimited:
        description: |-
          RetentionUnlimited 关闭条目数量上限，默认开启。

          开启时不执行任何清理，旧条目一直保留；关闭后由 RetentionCount
          决定每个源保留多少条。默认选无限是因为清理不可逆：源站过期后
          条目再也抓不回来，而磁盘成本远低于丢掉历史。
        type: boolean
      user_agent:
        description: 自定义 User-Agent，空则默认 Chrome 150
        type: string
    type: object
  config.ServerConfig:
    properties:
      host:
        description: 监听地址，默认 "0.0.0.0"
        type: string
      port:
        description: 监听端口，默认 8080
        type: integer
    type: object
  config.WebUIConfig:
    properties:
      home:
        $ref: '#/definitions/config.HomeWebUIConfig'
      login:
        $ref: '#/definitions/config.LoginWebUIConfig'
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  handler.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  handler.batchUpdateRSSFeedsRequest:
    properties:
      fetch_by:
        type: string
      fetch_enabled:
        description: FetchEnabled 暂停/恢复这个源的调度。省略表示不改。
        type: boolean
      fetch_interval:
        type: integer
      group_id:
        description: group_id 传 null 表示清空分组，省略则保持原分组不变。
        type: integer
        x-nullable: true
      ids:
        items:
          type: integer
        type: array
      remark:
        type: string
      title:
        description: 指针即三态：省略=不改，传值=写入，空串=清空（title / remark 适用）。
        type: string
    required:
    - ids
    type: object
  handler.changePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  handler.createBookmarkRequest:
    properties:
      group_id:
        type: integer
      icon:
        type: string
      priority:
        type: integer
      title:
        type: string
      url:
        type: string
    required:
    - group_id
    - title
    - url
    type: object
  handler.createGroupRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  handler.createPasteRequest:
    properties:
      content:
        type: string
    required:
    - content
    type: object
  handler.createRSSFeedRequest:
    properties:
      fetch_by:
        description: FetchBy 取 local / extension，省略时 local。
        type: string
      fetch_enabled:
        description: FetchEnabled 为 false 时保存但不参与调度。省略即为 true。
        type: boolean
      fetch_interval:
        description: FetchInterval 省略时默认 3600 秒。
        type: integer
      fetch_now:
        description: FetchNow 显式要求保存后抓一次（异步）。
        type: boolean
      group_id:
        type: integer
      remark:
        description: 使用者自己的备注
        type: string
      title:
        description: Title 可留空：等第一次抓取补全，或之后自己改。抓取不会覆盖已填的值。
        type: string
      url:
        type: string
    required:
    - url
    type: object
  handler.createRSSGroupRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  handler.createTodoRequest:
    properties:
      description:
        type: string
      due_date:
        type: string
      priority:
        type: integer
      title:
        type: string
    required:
    - title
    type: object
  handler.createUserRequest:
    properties:
      email:
        type: string
      level:
        description: Level 是权限等级 1–5；Role 仅作兼容，level 缺失时才采用。
        type: integer
      password:
        type: string
      role:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handler.issueExtensionKeyRequest:
    properties:
      expires_in:
        description: ExpiresIn 是 Go 风格的时长串（如 "720h"）。省略表示永不过期。
        type: string
      name:
        type: string
    required:
    - name
    type: object
  handler.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handler.pasteResponse:
    properties:
      content:
        type: string
      created_at:
        type: string
      delete_token:
        description: 仅创建时返回
        type: string
      expires_at:
        type: string
      id:
        type: string
    type: object
  handler.pasteSummary:
    properties:
      content_preview:
        type: string
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
    type: object
  handler.pushExtensionSubscriptionRequest:
    properties:
      enabled:
        description: |-
          Enabled 省略表示不碰 Extension 侧的启停状态；显式 true 会把
          被自动停用的源恢复，并清零对方的连续失败计数。
        type: boolean
      feed_id:
        type: integer
      fetch_now:
        description: FetchNow 省略时为 true，与协议默认一致。
        type: boolean
    required:
    - feed_id
    type: object
  handler.reorderBookmarksRequest:
    properties:
      group_id:
        type: integer
      ids:
        items:
          type: integer
        type: array
    required:
    - group_id
    - ids
    type: object
  handler.reorderGroupsRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  handler.reorderTodosRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  handler.resetPasswordRequest:
    properties:
      new_password:
        type: string
    required:
    - new_password
    type: object
  handler.setExtensionKeyRequest:
    properties:
      private_key:
        description: PrivateKey 接受 PKCS#8 PEM、裸 32 字节种子的 base64、或 openssl 的原文。
        type: string
    required:
    - private_key
    type: object
  handler.updateBookmarkRequest:
    properties:
      icon:
        type: string
      priority:
        type: integer
      title:
        type: string
      url:
        type: string
    type: object
  handler.updateGroupRequest:
    properties:
      name:
        type: string
      priority:
        type: integer
    required:
    - name
    type: object
  handler.updateProfileRequest:
    properties:
      email:
        type: string
      username:
        type: string
    type: object
  handler.updateRSSFeedRequest:
    properties:
      fetch_by:
        type: string
      fetch_enabled:
        description: FetchEnabled 暂停/恢复这个源的调度。省略表示不改。
        type: boolean
      fetch_interval:
        type: integer
      group_id:
        description: group_id 传 null 表示清空分组，省略则保持原分组不变。
        type: integer
        x-nullable: true
      remark:
        type: string
      title:
        description: 指针即三态：省略=不改，传值=写入，空串=清空（title / remark 适用）。
        type: string
    type: object
  handler.updateRSSGroupRequest:
    properties:
      name:
        type: string
      sort_order:
        type: integer
    type: object
  handler.updateTodoRequest:
    properties:
      description:
        type: string
      due_date:
        type: string
      priority:
        type: integer
      status:
        type: string
      title:
        type: string
    type: object
  handler.updateTodoStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  handler.updateUserRequest:
    properties:
      email:
        type: string
      is_active:
        type: boolean
      level:
        type: integer
      role:
        type: string
      username:
        type: string
    type: object
  hubclient.AccessKey:
    properties:
      client_id:
        type: string
      created_at:
        type: integer
      expires_at:
        type: integer
      id:
        type: string
      last_used_at:
        type: integer
      live:
        description: |-
          Live 是服务端算好的"未撤销且未过期"。对账只看这一个字段，
          不要自己拿 ExpiresAt 与本地时间比较 —— 时钟偏差会得出相反结论。
        type: boolean
      name:
        type: string
      revoked:
        type: boolean
    type: object
  hubclient.CreatedKey:
    properties:
      client_id:
        type: string
      created_at:
        type: integer
      expires_at:
        type: integer
      id:
        type: string
      key:
        type: string
      last_used_at:
        type: integer
      live:
        description: |-
          Live 是服务端算好的"未撤销且未过期"。对账只看这一个字段，
          不要自己拿 ExpiresAt 与本地时间比较 —— 时钟偏差会得出相反结论。
        type: boolean
      name:
        type: string
      revoked:
        type: boolean
    type: object
  hubclient.Subscription:
    properties:
      created_at:
        type: integer
      enabled:
        type: boolean
      error_count:
        description: 连续失败次数，成功一次即清零
        type: integer
      fetch_interval:
        description: 紧凑写法，如 "30m"、"1h30m"
        type: string
      id:
        type: integer
      last_error:
        description: 已截断到 500 字符，成功时为空
        type: string
      last_fetch_at:
        type: integer
      last_status:
        description: 最近一次 HTTP 状态码，0 表示还没抓过
        type: integer
      next_fetch_at:
        type: integer
      site_url:
        type: string
      title:
        type: string
      unread_count:
        type: integer
      url:
        type: string
    type: object
  model.Bookmark:
    properties:
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      group_id:
        type: integer
      icon:
        type: string
      id:
        type: integer
      priority:
        type: integer
      sort_order:
        type: integer
      title:
        type: string
      updated_at:
        type: string
      url:
        type: string
    type: object
  model.BookmarkGroup:
    properties:
      bookmarks:
        items:
          $ref: '#/definitions/model.Bookmark'
        type: array
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: integer
      name:
        type: string
      priority:
        type: integer
      sort_order:
        type: integer
      updated_at:
        type: string
    type: object
  model.MediaAsset:
    properties:
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      file_path:
        description: 相对路径（如 uploads/xxx.jpg）
        type: string
      file_size:
        description: 文件大小（字节）
        type: integer
      filename:
        description: 存储文件名（UUID）
        type: string
      height:
        description: 图片高度（像素）
        type: integer
      id:
        type: integer
      media_type:
        description: 媒体类型：image / video / audio / document
        type: string
      mime_type:
        description: MIME 类型
        type: string
      original_name:
        description: 原始文件名
        type: string
      owner_id:
        description: |-
          OwnerID 是上传者。图床的语义是“我传的图归我管”，没有这一列时
          任何登录用户都能删掉别人的图（含正在当背景用的）。
          0 表示历史数据（升级前的记录没有归属信息），只有 1–3 级能动。
        type: integer
      sha256:
        description: 内容哈希，用于去重与完整性校验
        type: string
      source:
        description: 来源：upload（用户上传）/ rss（抓取缓存）
        type: string
      updated_at:
        type: string
      width:
        description: 图片宽度（像素）
        type: integer
    type: object
  model.User:
    properties:
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      email:
        type: string
      id:
        type: integer
      is_active:
        description: 是否启用
        type: boolean
      level:
        description: |-
          Level 权限等级：1=admin 最高，5=只读。默认给最低权限，
          任何“忘了设等级”的路径都不会意外造出高权限账号。
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  service.AuthUpdate:
    properties:
      password:
        type: string
      session_secret:
        type: string
      username:
        type: string
    type: object
  service.BackgroundSettings:
    properties:
      fade_duration_ms:
        type: integer
      interval_seconds:
        type: integer
      mode:
        type: string
      selected_asset_ids:
        items:
          type: integer
        type: array
      transition_effect:
        type: string
    type: object
  service.BalanceStatus:
    properties:
      enabled:
        type: boolean
      error_count:
        type: integer
      last_refresh_at:
        type: string
      ok_count:
        type: integer
      target_count:
        type: integer
    type: object
  service.BalanceTargetInput:
    properties:
      api_key:
        type: string
      base_url:
        type: string
      enabled:
        type: boolean
      name:
        type: string
      sort_order:
        type: integer
      type:
        type: string
    type: object
  service.BalanceTargetView:
    properties:
      api_key_masked:
        type: string
      balance:
        description: 以下是运行时结果，来自内存缓存；从未刷新过时为零值。
        type: number
      base_url:
        type: string
      currency:
        type: string
      enabled:
        type: boolean
      has_api_key:
        type: boolean
      id:
        type: integer
      last_checked_at:
        type: string
      last_error:
        type: string
      name:
        type: string
      sort_order:
        type: integer
      status:
        type: string
      type:
        type: string
    type: object
  service.BookmarkSearchItem:
    properties:
      group_name:
        type: string
      id:
        type: integer
      title:
        type: string
      url:
        type: string
    type: object
  service.DatabaseUpdate:
    properties:
      dbname:
        type: string
      host:
        type: string
      password:
        type: string
      port:
        type: integer
      sslmode:
        type: string
      user:
        type: string
    type: object
  service.ExtensionHubKeyInfo:
    properties:
      broken:
        description: |-
          Broken 为真表示配置里的 PEM 存在但解析不了。
          与「未配置」分开：两者的修法不同（一个要重新粘贴，一个要先配）。
        type: boolean
      configured:
        description: Configured 是 Source 的布尔形式，前端直接用这个。
        type: boolean
      fingerprint:
        description: Fingerprint 是公钥的 SHA-256 前 16 位，便于在日志里核对。
        type: string
      public_key:
        type: string
      public_key_pem:
        description: |-
          PublicKeyPEM 是 PKIX PEM 全文，部署时优先用它：
          自带类型标记，不会与「DER 的 base64」混淆。
        type: string
      source:
        description: Source 只有两个取值：config（已配置）与 none（未配置）。
        type: string
    type: object
  service.ExtensionHubPushResult:
    properties:
      created:
        type: boolean
      feed_id:
        type: integer
      remote:
        $ref: '#/definitions/hubclient.Subscription'
      remote_id:
        description: RemoteID 是 Extension 侧的订阅 id，与本地 feed id 无关。
        type: integer
    type: object
  service.ExtensionHubRemoteSubscription:
    properties:
      created_at:
        type: integer
      enabled:
        type: boolean
      error_count:
        description: 连续失败次数，成功一次即清零
        type: integer
      fetch_interval:
        description: 紧凑写法，如 "30m"、"1h30m"
        type: string
      id:
        type: integer
      in_local:
        type: boolean
      last_error:
        description: 已截断到 500 字符，成功时为空
        type: string
      last_fetch_at:
        type: integer
      last_status:
        description: 最近一次 HTTP 状态码，0 表示还没抓过
        type: integer
      local_feed_id:
        type: integer
      next_fetch_at:
        type: integer
      site_url:
        type: string
      title:
        type: string
      unread_count:
        type: integer
      url:
        type: string
    type: object
  service.ExtensionHubStatus:
    properties:
      authenticated:
        type: boolean
      avatar_available:
        type: boolean
      base_url:
        type: string
      configured:
        type: boolean
      enabled:
        type: boolean
      error_code:
        description: |-
          ErrorCode 优先取协议错误码（invalid_request / unauthenticated / …）；
          配置与网络层的问题用本包自定的 disabled / config / network。
        type: string
      error_message:
        type: string
      fetch_available:
        description: |-
          Capabilities 记录对端是否真的实现了 /fetch 与 /avatar。

          声明式配置（extension.features）只能表达「我想用」，不能证明
          「对端有」。开着一个对端没实现的开关时，表现是每次抓取/头像都失败，
          而错误看起来像上游故障。这里用一次无副作用的探测把答案摊开。

          两条都探，不论 features 是否已开启：开关打开前就应当能看到
          「对端到底有没有」，否则只能靠打开后失败来发现。探测本身是
          无参数 GET，代价接近一个 RTT。
        type: boolean
      key_fingerprint:
        description: |-
          KeyFingerprint 是公钥的 SHA-256 前 16 位，用来在不暴露公钥全串的
          场合核对身份（例如日志、工单）。私钥永远不会出现在任何响应里。
        type: string
      key_source:
        description: KeySource 是这把密钥的来处：config / none。
        type: string
      public_key:
        description: |-
          PublicKey 是宿主公钥（标准 base64），供部署时与 Extension 侧核对。
          它本来就是公开信息，不构成泄露。
        type: string
      public_key_pem:
        description: PublicKeyPEM 是同一把公钥的 PKIX PEM 全文，部署时用它。
        type: string
      reachable:
        type: boolean
      ready:
        description: |-
          Ready 来自 Extension 的 /readyz（不签名、不进鉴权的那条探针）。

          指针三态：nil 表示没探到（路径不对、端点不存在、超时）。
          与 Authenticated 分开是因为它们是两个问题：签名通过只说明
          「请求是真的」，不代表对端的数据库可读、blob 目录可写。
        type: boolean
      ready_detail:
        type: string
      rss_available:
        type: boolean
      subscription_count:
        description: SubscriptionCount 只在 RSSAvailable 为真时有意义。
        type: integer
    type: object
  service.ExtensionHubSyncItem:
    properties:
      error:
        type: string
      feed_id:
        type: integer
      remote_id:
        type: integer
      status:
        description: created / updated / failed
        type: string
      url:
        type: string
    type: object
  service.ExtensionHubSyncResult:
    properties:
      created:
        type: integer
      failed:
        type: integer
      items:
        items:
          $ref: '#/definitions/service.ExtensionHubSyncItem'
        type: array
      skipped_local:
        description: |-
          SkippedLocal 是归属本机抓取、因此没有推送的条数。

          单独报出来是因为「total=0」有两种含义：本地确实没有订阅源，
          或者有源但都归本机。不区分的话，使用者会以为对账没干活。
        type: integer
      total:
        description: Total 是本次推送到 Extension 的条数，不含归属本机的源。
        type: integer
      updated:
        type: integer
    type: object
  service.ExtensionUpdate:
    properties:
      base_url:
        type: string
      enabled:
        type: boolean
      proxy_names:
        items:
          type: string
        type: array
      timeout_seconds:
        type: integer
    type: object
  service.FeedSchedule:
    properties:
      due:
        description: Due 为真表示按间隔算已经该抓了。
        type: boolean
      enabled:
        description: |-
          Enabled 是综合判定：全局开关打开、由本机抓、且单源未被暂停。
          界面上要同时看到这两个，才能分清「我停的」与「系统没开」。
        type: boolean
      error_msg:
        type: string
      feed_id:
        type: integer
      fetch_by:
        type: string
      fetch_enabled:
        description: FetchEnabled 是数据库里的单源开关（手动暂停时为 false）。
        type: boolean
      interval_seconds:
        type: integer
      last_fetch_at:
        type: integer
      next_fetch_at:
        description: NextFetchAt 是预计的下次抓取时间（Unix 秒）。
        type: integer
      overdue_seconds:
        description: OverdueSeconds 是超出计划的时间；未到期时为 0。
        type: integer
      title:
        type: string
      url:
        type: string
    type: object
  service.LogUpdate:
    properties:
      db_writer:
        type: boolean
      format:
        type: string
      level:
        type: string
    type: object
  service.RSSEntryView:
    properties:
      author:
        type: string
      excerpt:
        type: string
      feed_ids:
        items:
          type: integer
        type: array
      fetched_at:
        type: string
      has_content:
        type: boolean
      id:
        type: integer
      link:
        type: string
      magnet_locked:
        type: boolean
      magnet_locked_at:
        type: string
      magnet_url:
        type: string
      pikpak_error:
        type: string
      pikpak_saved_at:
        type: string
      pikpak_status:
        type: string
      pikpak_task_id:
        type: string
      published:
        type: string
      title:
        type: string
    type: object
  service.RssEntrySearchItem:
    properties:
      author:
        type: string
      feed_ids:
        items:
          type: integer
        type: array
      feed_title:
        type: string
      id:
        type: integer
      link:
        type: string
      snippet:
        description: |-
          Snippet 是正文里命中关键词附近的一小段纯文本，供前端高亮。
          为空表示命中在标题或作者上，正文摘要没有意义。
        type: string
      title:
        type: string
    type: object
  service.SafeAuthConfig:
    properties:
      username:
        type: string
    type: object
  service.SafeConfig:
    properties:
      auth:
        $ref: '#/definitions/service.SafeAuthConfig'
      bookmark:
        $ref: '#/definitions/config.BookmarkConfig'
      database:
        $ref: '#/definitions/service.SafeDatabaseConfig'
      extension:
        allOf:
        - $ref: '#/definitions/service.SafeExtensionConfig'
        description: Extension 含连接参数，但**绝不含私钥内容**。
      gravatar:
        $ref: '#/definitions/config.GravatarConfig'
      log:
        $ref: '#/definitions/config.LogConfig'
      proxy:
        $ref: '#/definitions/service.SafeProxyConfig'
      rss:
        $ref: '#/definitions/config.RSSConfig'
      server:
        $ref: '#/definitions/config.ServerConfig'
      webui:
        $ref: '#/definitions/config.WebUIConfig'
    type: object
  service.SafeDatabaseConfig:
    properties:
      dbname:
        type: string
      host:
        type: string
      port:
        type: integer
      sslmode:
        type: string
      user:
        type: string
    type: object
  service.SafeExtensionConfig:
    properties:
      base_url:
        type: string
      enabled:
        type: boolean
      private_key_set:
        type: boolean
      proxy_names:
        items:
          type: string
        type: array
      timeout_seconds:
        type: integer
    type: object
  service.SafeProxyConfig:
    properties:
      default:
        items:
          type: string
        type: array
      entries:
        items:
          $ref: '#/definitions/service.SafeProxyEntry'
        type: array
    type: object
  service.SafeProxyEntry:
    properties:
      enabled:
        type: boolean
      name:
        type: string
      type:
        type: string
    type: object
  service.ScheduleState:
    properties:
      due_count:
        description: DueCount 是当前已到期、等待下一轮扫描的数量。
        type: integer
      enabled:
        description: Enabled 是 config 里的总开关。
        type: boolean
      extension_count:
        type: integer
      feeds:
        items:
          $ref: '#/definitions/service.FeedSchedule'
        type: array
      local_count:
        type: integer
      tick_seconds:
        description: TickSeconds 是后台扫描周期：多久检查一次「有没有到期的源」。
        type: integer
    type: object
  service.SearchResult:
    properties:
      bookmarks:
        items:
          $ref: '#/definitions/service.BookmarkSearchItem'
        type: array
      bookmarks_total:
        type: integer
      page:
        description: |-
          Page / PerPage 回传生效值：前端传了超限的 per_page 时，
          它需要知道实际用了多少才能正确算页数。
        type: integer
      per_page:
        type: integer
      query:
        type: string
      rss_entries:
        items:
          $ref: '#/definitions/service.RssEntrySearchItem'
        type: array
      rss_entries_total:
        type: integer
      scope:
        description: Scope 原样回传，让前端知道这次返回覆盖了哪些源。
        type: string
      took_ms:
        description: TookMs 是服务端耗时，便于判断慢查询。
        type: integer
    type: object
  service.ServerUpdate:
    properties:
      host:
        type: string
      port:
        type: integer
    type: object
  service.TargetResult:
    properties:
      balance:
        description: 剩余余额
        type: number
      base_url:
        type: string
      currency:
        description: 货币单位，如 "CNY" / "USD" / "quota"
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      last_checked_at:
        description: 最后查询时间
        type: string
      last_error:
        description: 最近错误信息
        type: string
      name:
        type: string
      status:
        description: '"ok" / "error" / "checking" / "idle"'
        type: string
      type:
        type: string
    type: object
  service.UpdateBackgroundRequest:
    properties:
      fade_duration_ms:
        type: integer
      interval_seconds:
        type: integer
      mode:
        type: string
      selected_asset_ids:
        items:
          type: integer
        type: array
      transition_effect:
        type: string
    type: object
  service.UpdateConfigRequest:
    properties:
      auth:
        $ref: '#/definitions/service.AuthUpdate'
      bookmark:
        $ref: '#/definitions/config.BookmarkConfig'
      database:
        $ref: '#/definitions/service.DatabaseUpdate'
      extension:
        allOf:
        - $ref: '#/definitions/service.ExtensionUpdate'
        description: Extension 只接受连接参数；私钥走单独的 setKey 端点，不进这个结构体。
      gravatar:
        $ref: '#/definitions/config.GravatarConfig'
      log:
        $ref: '#/definitions/service.LogUpdate'
      proxy:
        $ref: '#/definitions/config.ProxyConfig'
      rss:
        $ref: '#/definitions/config.RSSConfig'
      server:
        $ref: '#/definitions/service.ServerUpdate'
      webui:
        $ref: '#/definitions/config.WebUIConfig'
    type: object
host: localhost:8080
info:
  contact:
    name: HomeHub
  description: 个人中枢项目 API 接口文档，包含认证、书签管理、RSS订阅、待办事项、媒体资源、系统日志、配置管理等功能。
  title: HomeHub API
  version: "1.1"
paths:
  /admin/logs:
    delete:
      description: 删除所有系统日志记录（仅管理员）
      produces:
      - application/json
      responses:
        "200":
          description: 清除成功
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 清除全部日志
      tags:
      - 系统日志
    get:
      description: 分页查看系统运行日志，支持按级别、关键词、时间范围筛选（仅管理员）
      parameters:
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页数量（默认 50）
        in: query
        name: per_page
        type: integer
      - description: 日志级别筛选：debug/info/warn/error
        in: query
        name: level
        type: string
      - description: 搜索关键词
        in: query
        name: q
        type: string
      - description: 起始时间（RFC3339 格式）
        in: query
        name: since
        type: string
      - description: 截止时间（RFC3339 格式）
        in: query
        name: until
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 日志列表（含分页信息）
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 查看系统日志
      tags:
      - 系统日志
  /admin/logs/stream:
    get:
      description: 通过 Server-Sent Events 实时推送系统日志（仅管理员）
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE 事件流
          schema:
            type: string
      summary: 实时日志推送
      tags:
      - 系统日志
  /admin/users:
    get:
      description: 返回所有注册用户的信息（仅管理员）
      produces:
      - application/json
      responses:
        "200":
          description: 用户列表
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.User'
                  type: array
              type: object
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 获取用户列表
      tags:
      - 用户管理
    post:
      consumes:
      - application/json
      description: 管理员创建新用户，可指定角色（admin/user）
      parameters:
      - description: 用户信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
        "400":
          description: 参数错误或用户名冲突
          schema:
            $ref: '#/definitions/handler.Response'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 创建用户
      tags:
      - 用户管理
  /admin/users/{id}:
    delete:
      description: 管理员删除用户及其所有会话
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 无效的用户 ID
          schema:
            $ref: '#/definitions/handler.Response'
        "403":
          description: 权限不足或不能删除自己
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 删除用户
      tags:
      - 用户管理
    get:
      description: 返回指定用户的完整信息（仅管理员）
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 用户详情
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
        "400":
          description: 无效的用户 ID
          schema:
            $ref: '#/definitions/handler.Response'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 获取用户详情
      tags:
      - 用户管理
    put:
      consumes:
      - application/json
      description: 管理员修改用户的用户名、角色或启用状态
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新字段
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.updateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handler.Response'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/handler.Response'
        "409":
          description: 用户名冲突
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 更新用户
      tags:
      - 用户管理
  /admin/users/{id}/refresh-avatar:
    post:
      description: 检查上游是否有更新，有变化则重新下载，上游确认无头像则清除缓存
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 刷新结果（updated 表示缓存是否变化）
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: 无效的用户 ID 或用户未设置邮箱
          schema:
            $ref: '#/definitions/handler.Response'
        "403":
          description: 权限不足或 Gravatar 已关闭
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/handler.Response'
        "502":
          description: 头像上游不可用
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 刷新头像缓存
      tags:
      - 用户管理
  /admin/users/{id}/reset-password:
    put:
      consumes:
      - application/json
      description: 管理员重置指定用户的密码，成功后该用户所有会话失效
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 新密码
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.resetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 重置成功
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handler.Response'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 重置用户密码
      tags:
      - 用户管理
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: 验证旧密码后修改为新密码，成功后清除所有会话
      parameters:
      - description: 修改密码请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.changePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 修改成功
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 请求参数错误或旧密码错误
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 修改密码
      tags:
