<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书签管理 - HomeHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/app.js" defer></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <a href="/" class="logo">HomeHub</a>
            <div class="header-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="切换暗色模式">🌓</button>
                <span id="header-guest"><a href="/login" class="btn-text">登录</a></span>
                <div class="user-menu" id="header-user" style="display:none">
                    <button class="user-name" type="button"><span id="header-username"></span> <span class="caret">▾</span></button>
                    <div class="user-dropdown">
                        <a href="/bookmarks">书签管理</a>
                        <a href="/media">媒体资源</a>
                        <a href="/settings">设置</a>
                        <button id="logout-btn" type="button" hx-post="/api/v1/auth/logout" hx-target="body">登出</button>
                    </div>
                </div>
            </div>
        </header>
        <main id="main-content" class="bookmarks-main">
            <div class="toolbar">
                <h2>书签管理</h2>
                <!-- 未登录提示（默认可见） -->
                <p class="login-hint auth-guest-content">请<a href="/login">登录</a>后管理书签</p>
                <!-- 管理工具栏（默认隐藏） -->
                <div class="auth-user-content" style="display:none">
                    <button class="btn-primary"
                        hx-post="/api/v1/bookmark-groups"
                        hx-include="#new-group-name"
                        hx-target="#group-list"
                        hx-swap="outerHTML">新建分组</button>
                    <input type="text" id="new-group-name" placeholder="分组名称">
                </div>
            </div>
            <div id="group-list"
                hx-get="/api/v1/bookmarks"
                hx-trigger="load"
                hx-swap="innerHTML">
                <p class="loading">加载中...</p>
            </div>
        </main>
    </div>
</body>
</html>
