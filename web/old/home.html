<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/app.js" defer></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <a href="/" class="logo">HomeHub</a>
            <div class="header-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="切换暗色模式">🌓</button>
                <!-- 未登录状态（默认可见） -->
                <span id="header-guest"><a href="/login" class="btn-text">登录</a></span>
                <!-- 已登录状态（默认隐藏，auth/status 返回 logged_in=true 后显示） -->
                <div class="user-menu" id="header-user" style="display:none">
                    <button class="user-name" type="button"><span id="header-username"></span> <span class="caret">▾</span></button>
                    <div class="user-dropdown">
                        <a href="/bookmarks">书签管理</a>
                        <a href="/media">媒体资源</a>
                        <a href="/settings">设置</a>
                        <button id="logout-btn" type="button" hx-post="/api/v1/auth/logout" hx-target="body">登出</button>
                    </div>
                </div>
            </div>
        </header>
        <main id="main-content" class="home-main">
            <div id="bookmark-list"
                hx-get="/api/v1/bookmarks"
                hx-trigger="load"
                hx-swap="innerHTML">
                <p class="loading">加载中...</p>
            </div>
        </main>
    </div>
</body>
</html>
