<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeHub - 登录</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/htmx.min.js"></script>
    <script>
        (function () {
            var theme = localStorage.getItem('homehub-theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <script src="/static/js/app.js" defer></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">🏠</div>
                <h1 class="login-title">HomeHub</h1>
                <p class="login-subtitle">欢迎回来，请登录您的账户</p>
            </div>
            <form id="login-form"
                hx-post="/api/v1/auth/login"
                hx-target="#login-error"
                hx-swap="none"
                hx-indicator="#login-spinner"
                hx-disabled-elt="#login-button">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username"
                        autocomplete="username" required
                        placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password"
                            autocomplete="current-password" required
                            placeholder="请输入密码">
                        <button type="button" class="password-toggle"
                            aria-label="切换密码可见性"
                            hx-on:click="var i=this.parentElement.querySelector('input');var s=i.type==='password';i.type=s?'text':'password';this.textContent=s?'🙈':'👁'">👁</button>
                    </div>
                </div>
                <div id="login-error" class="error-message" role="alert"></div>
                <button type="submit" id="login-button" class="btn-primary login-btn">
                    <span class="btn-label">登录</span>
                    <span id="login-spinner" class="htmx-indicator spinner"></span>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
